<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>닮은 토레카 찾기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Mochiy+Pop+One&family=Mochiy+Pop+P+One&display=swap" rel="stylesheet">
  <style>
    :root{
      --hotpink:#FF4FD8; --pink:#FF8AE2; --purple:#9B4DFF; --cyan:#46E3E6;
      --lemon:#FFE24D; --ink:#3A1D5C; --cream:#FFF6FB;
      --shadow: 4px 4px 0 var(--ink);
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body{ margin:0; }
    body{
      font-family:'Jua','Mochiy Pop P One',system-ui,sans-serif;
      color:var(--ink);
      min-height:100vh;
      background:
        radial-gradient(120% 90% at 10% 0%, #FFE6FA 0%, transparent 55%),
        radial-gradient(120% 90% at 100% 10%, #E3F6FF 0%, transparent 50%),
        linear-gradient(160deg,#FFD6F2 0%,#E7D4FF 48%,#D4F6FF 100%);
      background-attachment:fixed;
      overflow-x:hidden;
    }
    .display{ font-family:'Jua','Mochiy Pop One',system-ui,sans-serif; }

    /* 떠다니는 키치 데코 */
    .deco{ position:fixed; pointer-events:none; user-select:none; opacity:.85; z-index:0;
           filter:drop-shadow(2px 2px 0 rgba(58,29,92,.18)); animation:bob 6s ease-in-out infinite; }
    @keyframes bob{ 0%,100%{ transform:translateY(0) rotate(var(--r,0deg)); } 50%{ transform:translateY(-14px) rotate(var(--r,0deg)); } }

    .wrap{ position:relative; z-index:1; max-width:520px; margin:0 auto; padding:18px 18px 60px; }

    /* 상단 바 */
    .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
    .brand{ display:flex; align-items:center; gap:7px; font-size:18px; }
    .brand .chip{ background:var(--lemon); border:3px solid var(--ink); border-radius:999px;
                  width:34px; height:34px; display:grid; place-items:center; box-shadow:2px 2px 0 var(--ink); }

    /* 언어 토글 */
    .lang{ display:flex; background:#fff; border:3px solid var(--ink); border-radius:999px;
           box-shadow:2px 2px 0 var(--ink); overflow:hidden; }
    .lang button{ font-family:inherit; border:0; background:transparent; cursor:pointer;
                  padding:6px 12px; font-size:13px; color:var(--ink); }
    .lang button.on{ background:var(--hotpink); color:#fff; }

    /* 히어로 */
    .hero{ text-align:center; margin-bottom:20px; }
    .hero h1{ margin:0; font-size:34px; line-height:1.15; }
    .hero h1 .pop{
      background:linear-gradient(180deg,var(--hotpink),var(--purple));
      -webkit-background-clip:text; background-clip:text; color:transparent;
      text-shadow:0 0 0 transparent;
    }
    .hero p{ margin:10px 4px 0; font-size:14px; color:#7a5a93; }

    /* 카드(스티커) 공통 */
    .sticker{ background:#fff; border:3px solid var(--ink); border-radius:26px; box-shadow:var(--shadow); }

    /* 업로드 존 */
    .drop{ display:block; cursor:pointer; text-align:center; padding:42px 20px;
           border:3px dashed var(--purple); border-radius:26px; background:rgba(255,255,255,.72);
           transition:transform .12s, background .15s, border-color .15s; }
    .drop:hover{ background:#fff; border-color:var(--hotpink); }
    .drop.drag{ background:#fff; border-color:var(--hotpink); transform:scale(1.02); }
    .drop .emoji{ font-size:50px; display:block; margin-bottom:10px; }
    .drop .big{ display:block; font-size:18px; }
    .drop .hint{ display:block; font-size:12px; color:#9d83b3; margin-top:6px; }

    /* 미리보기 */
    .preview{ padding:16px; margin-top:16px; display:none; }
    .preview.show{ display:block; }
    .prow{ display:flex; align-items:center; gap:14px; }
    .pthumb{ width:72px; height:72px; border-radius:18px; object-fit:cover; border:3px solid var(--ink); }
    .pmeta b{ display:block; font-size:15px; max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pmeta span{ font-size:12px; color:#9d83b3; }

    /* 버튼 */
    .btn{ font-family:inherit; cursor:pointer; border:3px solid var(--ink); border-radius:999px;
          box-shadow:var(--shadow); transition:transform .08s, box-shadow .08s; }
    .btn:active{ transform:translate(4px,4px); box-shadow:0 0 0 var(--ink); }
    .btn-primary{ background:linear-gradient(180deg,var(--hotpink),var(--purple)); color:#fff;
                  font-size:18px; padding:14px; width:100%; }
    .btn-ghost{ background:#fff; color:var(--ink); padding:14px 16px; font-size:15px; }
    .btn-row{ display:flex; gap:10px; margin-top:14px; }

    /* 로딩 */
    .loading{ display:none; text-align:center; margin-top:34px; }
    .loading.show{ display:block; }
    .star-spin{ font-size:46px; display:inline-block; animation:spin 1.1s linear infinite; }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    .loading p{ margin-top:8px; font-size:14px; color:#7a5a93; }

    /* 에러 */
    .error{ display:none; margin-top:22px; text-align:center; }
    .error.show{ display:block; }
    .error .box{ background:#FFE6F0; border:3px solid var(--ink); border-radius:20px; box-shadow:var(--shadow);
                 padding:16px; font-size:14px; color:#c0246a; }
    .error a{ display:inline-block; margin-top:12px; color:#7a5a93; font-size:13px; cursor:pointer; }

    /* 결과 */
    .results{ display:none; margin-top:26px; }
    .results.show{ display:block; }
    .results h2{ text-align:center; font-size:20px; margin:0 0 16px; }
    .rcard{ position:relative; padding:14px 30px 14px 14px; margin-bottom:14px; display:flex; gap:14px; align-items:center;
            overflow:hidden; cursor:pointer; animation:pop .42s cubic-bezier(.18,.89,.32,1.28) both;
            transition:transform .12s, box-shadow .12s; }
    .rcard:hover{ transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink); }
    .rcard:active{ transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink); }
    .rcard .chev{ position:absolute; right:12px; top:50%; transform:translateY(-50%); font-size:26px; color:#c9b3df; }
    .taphint{ display:block; margin-top:8px; font-size:11px; color:#b69ccf; }
    @keyframes pop{ from{ opacity:0; transform:translateY(16px) scale(.95); } to{ opacity:1; transform:none; } }
    .rcard .bar{ position:absolute; left:0; top:0; bottom:0; width:9px; }
    .rcard .imgwrap{ position:relative; flex:0 0 auto; }
    .rcard img.card{ width:96px; height:96px; border-radius:18px; object-fit:cover; border:3px solid var(--ink);
                     background:#f3eaff; transform:rotate(-3deg); }
    .rcard .medal{ position:absolute; top:-12px; left:-12px; font-size:30px; filter:drop-shadow(1px 1px 0 var(--ink)); }
    .rcard .medal.num{ font-size:14px; color:#fff; width:28px; height:28px; border-radius:50%;
                       border:3px solid var(--ink); display:grid; place-items:center;
                       box-shadow:2px 2px 0 var(--ink); filter:none; top:-10px; left:-10px; }
    .rcard .info{ flex:1 1 auto; min-width:0; }
    .badge{ display:inline-block; color:#fff; font-size:12px; padding:3px 11px; border-radius:999px;
            border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink); }
    .series{ font-size:12px; color:#9d83b3; margin-left:6px; }
    .rname{ font-size:18px; margin:8px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rname-sub{ display:block; font-size:12px; color:#9d83b3; }
    .mlink{ display:inline-block; margin-top:10px; font-size:12px; text-decoration:none; color:#fff;
            background:var(--purple); border:2px solid var(--ink); border-radius:999px; padding:4px 12px;
            box-shadow:2px 2px 0 var(--ink); }
    .again{ display:block; margin:24px auto 0; }

    /* 상세 */
    .detail{ display:none; margin-top:14px; animation:pop .35s cubic-bezier(.18,.89,.32,1.28) both; }
    .detail.show{ display:block; }
    .dback{ margin-bottom:14px; }
    .dcard{ overflow:hidden; }
    .dhero{ display:grid; place-items:center; padding:24px 24px 52px; }
    /* 플립 카드 */
    .flip{ position:relative; width:100%; max-width:270px; aspect-ratio:3/4; cursor:pointer; perspective:1100px; }
    .flip.noback{ cursor:default; }
    .flip-inner{ position:absolute; inset:0; transform-style:preserve-3d;
                 transition:transform .65s cubic-bezier(.2,.7,.3,1.35); }
    .flip.flipped .flip-inner{ transform:rotateY(180deg); }
    .flip-face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
                border:3px solid var(--ink); border-radius:18px; box-shadow:var(--shadow);
                overflow:hidden; background:#f3eaff; }
    .flip-face img{ width:100%; height:100%; object-fit:cover; display:block; }
    .flip-back{ transform:rotateY(180deg); }
    .face-tag{ position:absolute; top:8px; left:8px; z-index:2; color:#fff; font-size:11px;
               padding:2px 10px; border:2px solid var(--ink); border-radius:999px; box-shadow:2px 2px 0 var(--ink);
               backface-visibility:hidden; -webkit-backface-visibility:hidden; }
    /* absolute 태그가 backface를 무시하고 비치는 문제 방지: 현재 보이는 면의 태그만 노출 */
    .flip.flipped .flip-front .face-tag{ display:none; }
    .flip:not(.flipped) .flip-back .face-tag{ display:none; }
    .flip-hint{ position:absolute; bottom:-30px; left:0; right:0; text-align:center; font-size:12px; color:#7a5a93; }
    .flip.noback .flip-hint{ display:none; }
    .dbody{ padding:18px; border-top:3px solid var(--ink); }
    .dname{ font-size:26px; margin:10px 0 2px; }
    .ddesc{ font-size:13px; color:#7a5a93; margin:12px 0 0; line-height:1.5; }
    .dscore{ display:flex; align-items:center; gap:10px; margin-top:14px; font-size:13px; color:#7a5a93; }
    .dscore span{ flex:0 0 auto; }
    .dscore b{ flex:0 0 auto; font-size:16px; }
    .bar-bg{ flex:1 1 auto; height:12px; border-radius:999px; background:#efe6fb; border:2px solid var(--ink); overflow:hidden; }
    .bar-fill{ height:100%; border-radius:999px; transition:width .5s ease; }
    .thumbs{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
    .thumb{ margin:0; text-align:center; }
    .thumb img{ width:84px; height:84px; object-fit:cover; border-radius:14px; border:3px solid var(--ink);
                box-shadow:2px 2px 0 var(--ink); background:#f3eaff; }
    .thumb figcaption{ font-size:11px; color:#9d83b3; margin-top:5px; }
    .dmeta{ font-size:11px; color:#b69ccf; margin:14px 0 0; }

    .foot{ text-align:center; font-size:11px; color:#a98fbf; margin-top:30px; }
    .foot a{ color:#a98fbf; }
  </style>
</head>
<body>
  <!-- 배경 데코 -->
  <div class="deco" style="top:8%;left:4%;font-size:30px;--r:-12deg">★</div>
  <div class="deco" style="top:16%;right:6%;font-size:26px;--r:14deg;animation-delay:1.2s">✦</div>
  <div class="deco" style="top:42%;left:-2%;font-size:34px;--r:8deg;animation-delay:.6s">♡</div>
  <div class="deco" style="bottom:14%;right:3%;font-size:30px;--r:-10deg;animation-delay:1.8s">✧</div>
  <div class="deco" style="bottom:8%;left:8%;font-size:24px;--r:18deg;animation-delay:.9s">⋆</div>

  <div class="wrap">

    <!-- 상단 바 -->
    <div class="topbar">
      <div class="brand display"><span class="chip">💖</span><span data-i18n="brand"></span></div>
      <div class="lang">
        <button id="langKo" onclick="setLang('ko')">한국어</button>
        <button id="langJa" onclick="setLang('ja')">日本語</button>
      </div>
    </div>

    <!-- 히어로 -->
    <div class="hero">
      <h1 class="display"><span class="pop" data-i18n="title"></span></h1>
      <p data-i18n="subtitle"></p>
    </div>

    <!-- 업로드 -->
    <label id="drop" class="drop">
      <input id="fileInput" type="file" accept="image/*" hidden />
      <span class="emoji">📸</span>
      <span class="big display" data-i18n="drop"></span>
      <span class="hint" data-i18n="dropHint"></span>
    </label>

    <!-- 미리보기 -->
    <div id="preview" class="sticker preview">
      <div class="prow">
        <img id="previewImg" class="pthumb" alt="" />
        <div class="pmeta">
          <b id="fileName"></b>
          <span id="fileMeta"></span>
        </div>
      </div>
      <div class="btn-row">
        <button id="searchBtn" class="btn btn-primary display" data-i18n="searchBtn"></button>
        <button id="resetBtn" class="btn btn-ghost display" data-i18n="resetBtn"></button>
      </div>
    </div>

    <!-- 로딩 -->
    <div id="loading" class="loading">
      <span class="star-spin">✦</span>
      <p data-i18n="loading"></p>
    </div>

    <!-- 에러 -->
    <div id="error" class="error">
      <div class="box" id="errorMsg"></div>
      <a onclick="resetAll()" data-i18n="backToStart"></a>
    </div>

    <!-- 결과 -->
    <div id="results" class="results">
      <h2 class="display" data-i18n="resultsTitle"></h2>
      <div id="resultList"></div>
      <button class="btn btn-primary again display" style="max-width:280px" onclick="resetAll()" data-i18n="againBtn"></button>
    </div>

    <!-- 상세 -->
    <div id="detail" class="detail"></div>

    <div class="foot">powered by <a href="https://card.taba.asia" target="_blank">Cutie Card</a></div>
  </div>

  <script>
    const API_URL = "/api/match";

    // ───────── 다국어 ─────────
    const I18N = {
      ko: {
        brand: "토레카 매칭",
        title: "닮은 토레카 찾기",
        subtitle: "사진을 올리면 가장 닮은 토레카 TOP 10을 보여드려요 ✨",
        drop: "사진을 끌어다 놓거나 탭하세요",
        dropHint: "JPEG / PNG · 최대 15MB",
        searchBtn: "🔍 찾기",
        resetBtn: "다시",
        loading: "닮은 토레카를 찾는 중이에요...",
        resultsTitle: "✨ 가장 닮은 토레카 TOP 10 ✨",
        tapHint: "탭하면 자세히 보기",
        detailBack: "← 목록으로",
        similarity: "닮음 점수",
        frontLabel: "앞면",
        backLabel: "뒷면",
        flipHint: "탭하면 뒤집기",
        registered: "등록일",
        againBtn: "🔄 다른 사진으로 다시",
        backToStart: "처음으로",
        errNotImage: "이미지 파일만 올릴 수 있어요.",
        errTooBig: "파일이 너무 커요. 15MB 이하로 올려주세요.",
        errAuth: "인증에 실패했어요.",
        errServer: "서버 오류가 발생했어요.",
        errNotBuilt: "카드 데이터가 아직 준비되지 않았어요.",
        errNoMatch: "닮은 토레카를 찾지 못했어요. 다른 사진으로 해보세요.",
        errNetwork: "네트워크 오류가 발생했어요. 잠시 후 다시 시도해주세요.",
      },
      ja: {
        brand: "トレカマッチング",
        title: "似てるトレカ探し",
        subtitle: "写真をアップすると一番似てるトレカTOP10を表示するよ ✨",
        drop: "写真をドラッグ＆ドロップ or タップ",
        dropHint: "JPEG / PNG · 最大15MB",
        searchBtn: "🔍 探す",
        resetBtn: "やり直す",
        loading: "似てるトレカを探してるよ...",
        resultsTitle: "✨ 一番似てるトレカ TOP10 ✨",
        tapHint: "タップで詳細を見る",
        detailBack: "← 一覧に戻る",
        similarity: "類似度スコア",
        frontLabel: "表",
        backLabel: "裏",
        flipHint: "タップで裏返す",
        registered: "登録日",
        againBtn: "🔄 別の写真でもう一度",
        backToStart: "最初に戻る",
        errNotImage: "画像ファイルだけアップできるよ。",
        errTooBig: "ファイルが大きすぎ。15MB以下にしてね。",
        errAuth: "認証に失敗したよ。",
        errServer: "サーバーエラーが発生したよ。",
        errNotBuilt: "カードデータがまだ準備中だよ。",
        errNoMatch: "似てるトレカが見つからなかったよ。別の写真で試してね。",
        errNetwork: "ネットワークエラーが発生したよ。少し待ってからもう一度。",
      },
    };

    const $ = (id) => document.getElementById(id);
    let lang = localStorage.getItem("lang") || ((navigator.language || "").toLowerCase().startsWith("ja") ? "ja" : "ko");
    let selectedFile = null;
    let lastItems = null;     // 언어 전환 시 재렌더용
    let lastErrorKey = null;  // 언어 전환 시 에러 재번역용
    let detailIdx = null;     // 상세화면에서 보고 있는 항목

    function t(key) { return (I18N[lang] && I18N[lang][key]) || I18N.ko[key] || key; }

    function setLang(l) {
      lang = l;
      localStorage.setItem("lang", l);
      document.documentElement.lang = l;
      // 정적 텍스트
      document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
      // 토글 상태
      $("langKo").classList.toggle("on", l === "ko");
      $("langJa").classList.toggle("on", l === "ja");
      // 동적 영역
      if (lastItems) {
        renderResults(lastItems);                               // 목록 갱신 (results 표시)
        if (detailIdx != null) renderDetail(lastItems[detailIdx]); // 상세 보던 중이면 다시 상세로
      }
      if (lastErrorKey) $("errorMsg").textContent = t(lastErrorKey);
    }

    // ───────── 상태 토글 ─────────
    function show(name) {
      $("preview").classList.toggle("show", name === "preview");
      $("loading").classList.toggle("show", name === "loading");
      $("error").classList.toggle("show", name === "error");
      $("results").classList.toggle("show", name === "results");
      $("detail").classList.toggle("show", name === "detail");
      // 단순화: 어떤 패널이든 떠 있으면 큰 업로드존은 숨김 (idle 일 때만 노출)
      $("drop").style.display = name ? "none" : "block";
    }

    // ───────── 파일 선택 ─────────
    function handleFile(file) {
      if (!file || !file.type.startsWith("image/")) return showError("errNotImage");
      if (file.size > 15 * 1024 * 1024) return showError("errTooBig");
      selectedFile = file;
      lastItems = null; lastErrorKey = null;
      $("previewImg").src = URL.createObjectURL(file);
      $("fileName").textContent = file.name;
      $("fileMeta").textContent = (file.size / 1024).toFixed(0) + " KB";
      show("preview");
    }

    $("fileInput").addEventListener("change", (e) => handleFile(e.target.files[0]));

    const dz = $("drop");
    ["dragover", "dragenter"].forEach((ev) =>
      dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add("drag"); }));
    ["dragleave", "drop"].forEach((ev) =>
      dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove("drag"); }));
    dz.addEventListener("drop", (e) => handleFile(e.dataTransfer.files[0]));

    // ───────── 검색 ─────────
    $("searchBtn").addEventListener("click", search);
    $("resetBtn").addEventListener("click", resetAll);

    async function search() {
      if (!selectedFile) return;
      show("loading");
      try {
        const fd = new FormData();
        fd.append("image", selectedFile);
        const res = await fetch(API_URL, { method: "POST", body: fd });
        if (res.status === 401 || res.status === 403) return showError("errAuth");
        if (!res.ok) return showError("errServer");
        const data = await res.json();
        if (data.catalog_built === false) return showError("errNotBuilt");
        const items = (data.items || []).slice(0, 10);
        if (items.length === 0) return showError("errNoMatch");
        renderResults(items);
      } catch (err) {
        showError("errNetwork");
      }
    }

    // ───────── 결과 렌더 ─────────
    function renderResults(items) {
      lastItems = items; lastErrorKey = null;
      const medals = ["🥇", "🥈", "🥉"];
      $("resultList").innerHTML = items.map((it, i) => {
        const pct = Math.round((it.score || 0) * 100);
        const color = it.member?.color || "#FF4FD8";
        const nameMain = memberName(it, "main");
        const nameSub = memberName(it, "sub");
        const series = it.series?.label || "";
        return `
        <div class="sticker rcard" style="animation-delay:${i * 0.09}s" role="button" tabindex="0" onclick="openDetail(${i})" onkeydown="if(event.key==='Enter'||event.key===' ')openDetail(${i})">
          <div class="bar" style="background:${color}"></div>
          <div class="imgwrap">
            ${i < 3 ? `<span class="medal">${medals[i]}</span>` : `<span class="medal num" style="background:${color}">${i + 1}</span>`}
            <img class="card" src="${it.image_url}" alt="${nameMain || ""}" onerror="this.style.opacity=.3" />
          </div>
          <div class="info">
            <span class="badge" style="background:${color}">${pct}%</span>
            ${series ? `<span class="series">${series}</span>` : ""}
            <p class="rname display">${nameMain || ""}</p>
            ${nameSub ? `<span class="rname-sub">${nameSub}</span>` : ""}
            <span class="taphint">${t("tapHint")} ›</span>
          </div>
          <span class="chev">›</span>
        </div>`;
      }).join("");
      show("results");
    }

    function memberName(it, which) {
      const ko = it.member?.name_ko || "";
      const ja = it.member?.name_ja || "";
      if (which === "main") return lang === "ja" ? (ja || ko) : (ko || ja);
      return lang === "ja" ? ko : ja; // 보조 표기
    }

    // ───────── 상세 ─────────
    function openDetail(idx) {
      if (!lastItems || !lastItems[idx]) return;
      detailIdx = idx;
      renderDetail(lastItems[idx]);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderDetail(it) {
      const pct = Math.round((it.score || 0) * 100);
      const color = it.member?.color || "#FF4FD8";
      const nameMain = memberName(it, "main");
      const nameSub = memberName(it, "sub");
      const series = it.series?.label || "";
      const created = it.created_at ? new Date(it.created_at).toLocaleDateString(lang === "ja" ? "ja-JP" : "ko-KR") : "";
      const hasBack = !!it.back_image_url;
      $("detail").innerHTML = `
        <button class="btn btn-ghost display dback" onclick="closeDetail()">${t("detailBack")}</button>
        <div class="sticker dcard">
          <div class="dhero" style="background:${color}1a">
            <div class="flip${hasBack ? "" : " noback"}" style="--card:${color}" onclick="flipCard(this)">
              <div class="flip-inner">
                <div class="flip-face flip-front">
                  <span class="face-tag" style="background:${color}">${t("frontLabel")}</span>
                  <img src="${it.image_url}" alt="${nameMain}" onload="fitFlip(this)" onerror="this.style.opacity=.3" />
                </div>
                ${hasBack ? `
                <div class="flip-face flip-back">
                  <span class="face-tag" style="background:${color}">${t("backLabel")}</span>
                  <img src="${it.back_image_url}" alt="${t("backLabel")}" onerror="this.closest('.flip').classList.add('noback')" />
                </div>` : ""}
              </div>
              ${hasBack ? `<span class="flip-hint">↻ ${t("flipHint")}</span>` : ""}
            </div>
          </div>
          <div class="dbody">
            <span class="badge" style="background:${color}">${pct}%</span>
            ${series ? `<span class="series">${series}</span>` : ""}
            <h3 class="dname display">${nameMain}</h3>
            ${nameSub ? `<p class="rname-sub">${nameSub}</p>` : ""}
            <div class="dscore"><span>${t("similarity")}</span>
              <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
              <b style="color:${color}">${pct}%</b>
            </div>
            ${it.description ? `<p class="ddesc">${it.description}</p>` : ""}
            ${created ? `<p class="dmeta">${t("registered")}: ${created}</p>` : ""}
          </div>
        </div>`;
      show("detail");
    }

    // 플립 카드: 뒷면 있을 때만 뒤집기
    function flipCard(el) { if (!el.classList.contains("noback")) el.classList.toggle("flipped"); }
    // 앞면 이미지 비율에 맞춰 카드 박스 비율 조정 (잘림 없이)
    function fitFlip(img) {
      if (img.naturalWidth && img.naturalHeight) {
        img.closest(".flip").style.aspectRatio = img.naturalWidth + " / " + img.naturalHeight;
      }
    }

    function closeDetail() { detailIdx = null; show("results"); }

    // ───────── 헬퍼 ─────────
    function showError(key) { lastErrorKey = key; $("errorMsg").textContent = t(key); show("error"); }

    function resetAll() {
      selectedFile = null; lastItems = null; lastErrorKey = null; detailIdx = null;
      $("fileInput").value = "";
      show(null);
    }

    // 초기화
    setLang(lang);
  </script>
</body>
</html>
